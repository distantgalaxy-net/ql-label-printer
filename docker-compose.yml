# ------------------------------------------------------------------
# labelprinter - Brother QL label print service
# Date: 2026-11-08 16:01 GMT (updated; first written 2026-11-07 18:30 GMT)
# Developer: Ash @ Distant Galaxy (@distantgalaxy-net)
#
# Builds the image from the Dockerfile in this folder and serves the
# web page on port 8013. Everything else is set in the page's Settings
# tab and saved in ./data: printer model, IP address and port, time
# zone and the optional password. Only the 62mm continuous roll
# (DK-22205) is supported.
# ------------------------------------------------------------------
services:
  labelprinter:
    build: .                              # build from ./Dockerfile
    image: labelprinter:latest
    container_name: labelprinter
    restart: unless-stopped
    ports:
      # Web port: "<listen address>:<port on the host>:8013 inside the container".
      # - Change the middle number if 8013 is already used on your host
      #   (e.g. "127.0.0.1:8020:8013"), and point your reverse proxy at it.
      # - 127.0.0.1 means only the host itself can connect (e.g. through a
      #   reverse proxy, or Home Assistant running on the same machine).
      #   Only remove "127.0.0.1:" if your network is trusted or you have
      #   set a password in the Settings tab - and never forward this port
      #   from the internet.
      - "127.0.0.1:8013:8013"
    volumes:
      - ./data:/data                      # settings, presets, icons, password hash
    # Forgotten the password? Uncomment, restart once (the password is
    # removed), then comment it out again and restart.
    # environment:
    #   RESET_PASSWORD: "true"
