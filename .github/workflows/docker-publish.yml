# ------------------------------------------------------------------
# ql-label-printer - build and publish the Docker image to Docker Hub
# Date: 2026-11-09 10:40 GMT (updated; first written 2026-11-08 18:05 GMT)
# Developer: Ash @ Distant Galaxy (@distantgalaxy-net)
#
# When it runs:
#   - A version tag is pushed, e.g. by publishing a GitHub release "v1.0.0".
#     The image is tagged 1.0.0, 1.0 and latest. The tag must match
#     app/VERSION (shown in the Settings tab), or nothing is published.
#   - By hand: Actions tab -> "Publish Docker image" -> Run workflow.
#     The image is tagged with the branch name (e.g. "main") - handy for
#     testing without changing "latest".
#
# What it builds: the Dockerfile in the repo root, for Intel/AMD (amd64)
# and ARM (arm64) machines, so it runs on any recent Synology NAS or a
# Raspberry Pi.
#
# Needs, in Settings -> Secrets and variables -> Actions:
#   variable DOCKERHUB_USERNAME  Docker Hub username (e.g. distantgalaxy)
#   secret   DOCKERHUB_TOKEN     Docker Hub access token (Read & Write)
# ------------------------------------------------------------------
name: Publish Docker image

on:
  push:
    tags: ["v*.*.*"]          # version tags only, e.g. v1.0.0
  workflow_dispatch:          # manual "Run workflow" button

# The workflow only needs to read the code; Docker Hub uses its own token
permissions:
  contents: read

env:
  IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/ql-label-printer

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Get the code at the tag (or branch) that triggered the run
      - name: Check out the code
        uses: actions/checkout@v4

      # A release tag must match app/VERSION, so the version shown in the
      # Settings tab is always the one published (manual runs skip this)
      - name: Check the tag matches app/VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          file_version="$(head -n 1 app/VERSION | tr -d '[:space:]')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$file_version" != "$tag_version" ]; then
            echo "::error::Tag v$tag_version doesn't match app/VERSION ($file_version). Update app/VERSION, then tag again."
            exit 1
          fi

      # QEMU lets this Intel machine build the ARM version too
      - name: Set up QEMU (for ARM builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Work out the image tags and labels from the git tag or branch:
      #   v1.2.3 -> 1.2.3, 1.2 and latest;  manual run on main -> main
      - name: Work out image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=QL Label Printer
            org.opencontainers.image.description=Print labels on Brother QL network printers from your phone or Home Assistant
            org.opencontainers.image.licenses=GPL-3.0

      # Build for both architectures and push. The GitHub Actions cache
      # makes later builds much quicker.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
