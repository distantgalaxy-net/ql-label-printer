<!doctype html>
<!--
  labelprinter - login page (only used when a password has been set)
  Date: 2026-11-11 12:00 GMT (updated; first written 2026-11-08 16:01 GMT)
  Developer: Ash @ Distant Galaxy (@distantgalaxy-net)
  Uses the accent colour chosen in Settings: the main page remembers it in
  this browser (localStorage), since settings can't be read before login.
  Posts the password to /api/login; on success the server sets a signed
  session cookie (30 days) and we go to the main page.
-->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Label Printer</title>
<link rel="stylesheet" href="/theme.css">
<script>
  // Apply the accent colour remembered from the main page (default green)
  try { document.documentElement.dataset.accent = localStorage.getItem("labelprinter-accent") || "green"; } catch (e) {}
</script>
<style>
  :root {
    --bg: #f3f4f1; --card: #ffffff; --fg: #1d2420; --muted: #5d6a63; --line: #d9ddd7;
    --accent: #2f6b4f; --accent-fg: #ffffff; --bad: #b3402f; --field: #fbfbfa;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121614; --card: #1b201d; --fg: #e5ebe7; --muted: #9aa8a0; --line: #2d3530;
            --accent: #5fae86; --accent-fg: #0f1411; --bad: #ef8a78; --field: #161a18;
            color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 400px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 1.25rem; margin: 0 0 16px; }
  form { display: grid; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  label { display: grid; gap: 4px; font-size: .9rem; color: var(--muted); }
  input { font: inherit; color: var(--fg); background: var(--field); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px; width: 100%; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 12px;
    background: var(--accent); color: var(--accent-fg); cursor: pointer; }
  button:disabled { opacity: .55; }
  #status { min-height: 1.4em; margin: 0; font-size: .92rem; color: var(--bad); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Label Printer</h1>
  <form id="login">
    <label>Password<input id="password" type="password" autocomplete="current-password" required autofocus></label>
    <button type="submit" id="go">Log in</button>
    <p id="status" role="status"></p>
  </form>
</div>
<script>
// Send the password; go to the app on success, or show why not
document.getElementById("login").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("go"), status = document.getElementById("status");
  btn.disabled = true; status.textContent = "";
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: document.getElementById("password").value }) });
    const j = await r.json().catch(() => ({ ok: false, message: "No reply from the label service" }));
    // Back to the page the link asked for (e.g. /#luggage), if any
    if (j.ok) { location.href = "/" + location.hash; return; }
    status.textContent = j.message || "Couldn't log in";
  } catch (err) { status.textContent = "Can't reach the label service"; }
  btn.disabled = false;
});
</script>
</body>
</html>
